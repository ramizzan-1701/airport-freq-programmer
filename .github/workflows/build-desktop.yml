name: Test and build desktop apps

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    name: Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      # pywebview is a hard dependency of the afp package, and on Linux it
      # needs GTK/WebKit system libraries that aren't on the runner image.
      # The tests never open a window, but importing afp.desktop still
      # requires the module to load.
      - name: Install Linux GUI libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-gi gir1.2-webkit2-4.1 libcairo2-dev libgirepository1.0-dev

      - name: Install package
        run: pip install -e ".[dev]"

      - name: Run tests
        run: pytest -q

  build-windows:
    name: Build Windows .exe
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package and PyInstaller
        run: pip install -e ".[build-windows]"

      # An attempt at Defender's Trojan:Win32/Wacatac.B!ml verdict on the
      # download: the theory was that the stock bootloader -- the small C
      # launcher every PyInstaller app on Windows shares, seen in enough
      # real malware to be scored on sight -- would stop matching if it
      # were compiled here instead of shipped as a prebuilt wheel.
      #
      # It did not work, and the claim that it had was wrong. The
      # bootloader's SHA-256 came out identical (2291f269...) on all five
      # runs, and the only commit between a build that downloaded cleanly
      # and one that was flagged touched packaging/py2app_setup.py and
      # tests/test_about.py, neither of which reaches the Windows
      # executable. Two builds with the same content were scored
      # differently, so the verdict is nondeterministic per hash and this
      # step is not what decides it.
      #
      # Kept anyway: it costs nothing (the runner already has MSVC), it
      # is the honest way to build, and it removes one variable if the
      # verdict is ever investigated properly. The real fixes are a
      # false-positive submission to Microsoft for a given binary, and a
      # code-signing certificate for the long run -- reputation attaches
      # to the certificate rather than to each new hash.
      - name: Rebuild the PyInstaller bootloader from source
        shell: bash
        run: |
          pip install --no-binary pyinstaller --force-reinstall --no-cache-dir "pyinstaller>=6.0" 2>&1 | tee install.log
          # pip falls back to a wheel silently if the source build is
          # unavailable, which would leave the stock bootloader in place
          # and this whole step doing nothing.
          grep -q "Building wheel for pyinstaller" install.log || { echo "::error::PyInstaller came from a wheel -- bootloader NOT rebuilt"; exit 1; }

      - name: Record the bootloader's identity
        shell: bash
        run: |
          python - <<'PY'
          import hashlib, pathlib, PyInstaller
          root = pathlib.Path(PyInstaller.__file__).parent / "bootloader"
          for exe in sorted(root.rglob("*.exe")):
              digest = hashlib.sha256(exe.read_bytes()).hexdigest()
              print(f"{exe.relative_to(root)}  {digest}  {exe.stat().st_size:,} bytes")
          PY

      - name: Build
        run: pyinstaller --noconfirm --clean packaging/afp.spec

      # Rendered from src/afp/about.py, so it says what the About screen
      # says without a second copy of the words existing anywhere.
      - name: Write the readme that ships beside it
        run: python packaging/make_readme.py --platform windows dist/README.txt

      - uses: actions/upload-artifact@v7
        with:
          name: FTA850FrequencyManager-windows
          # Both paths sit in dist/, so that is the common root and both
          # land at the top of the downloaded zip rather than nested.
          #
          # Unquoted, unlike the single-path form this replaced: a block
          # scalar is literal, so quotes would become part of the glob
          # and match nothing. One pattern per line, so the spaces in the
          # executable's name need no escaping.
          path: |
            dist/FTA-850 Frequency Manager.exe
            dist/README.txt
          if-no-files-found: error

  build-macos:
    name: Build macOS .app
    needs: test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package and py2app
        run: pip install -e ".[build-macos]"

      - name: Build
        run: python packaging/py2app_setup.py py2app

      # "It built" and "it runs" are different claims here. Twice now a
      # module resolved by string at runtime (uvicorn's protocols, then
      # anyio's backend) was invisible to the dependency graph, so the
      # bundle built clean and then failed on the first real request.
      # These are exactly the modules nothing statically imports, so
      # nothing but an explicit check will notice they're missing.
      - name: Verify runtime-imported modules were bundled
        run: |
          set -euo pipefail
          APP="$(find dist -maxdepth 1 -name '*.app' -print -quit)"
          LIB="$APP/Contents/Resources/lib/python3.12"
          status=0
          for path in \
            "anyio/_backends/_asyncio.py" \
            "uvicorn/protocols/http/h11_impl.py" \
            "uvicorn/lifespan/on.py" \
            "uvicorn/loops/asyncio.py" \
            "afp/web/static/index.html" \
            "afp/web/static/app.js" \
            "afp/web/static/style.css" \
            "afp/web/static/fonts/chakra-petch-700.woff2" \
            "afp/web/static/fonts/ibm-plex-mono-400.woff2"
          do
            if [ -e "$LIB/$path" ]; then
              echo "ok      $path"
            else
              echo "MISSING $path"; status=1
            fi
          done
          exit $status

      # Zip before uploading: upload-artifact flattens the .app bundle and
      # drops the executable bit, so an uploaded raw .app won't launch.
      # The bundle name is resolved rather than hardcoded -- py2app derives
      # it from the entry script, so it depends on whether the `name=` in
      # py2app_setup.py wins over the launcher.py filename.
      - name: Zip the .app bundle
        run: |
          set -euo pipefail
          APP_PATH="$(find dist -maxdepth 1 -name '*.app' -print -quit)"
          if [ -z "$APP_PATH" ]; then
            echo "No .app bundle produced in dist/"; ls -la dist; exit 1
          fi
          echo "Found bundle: $APP_PATH"
          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" "dist/FTA850FrequencyManager-macos.zip"

      # Rendered from src/afp/about.py, so it says what the About screen
      # says without a second copy of the words existing anywhere.
      #
      # Left beside the zipped bundle rather than inside it: the first
      # thing this file has to say is that the app must be unzipped
      # before it will open, which is no use sealed inside that zip.
      - name: Write the readme that ships beside it
        run: python packaging/make_readme.py --platform macos dist/README.txt

      - uses: actions/upload-artifact@v7
        with:
          name: FTA850FrequencyManager-macos
          path: |
            dist/FTA850FrequencyManager-macos.zip
            dist/README.txt
          if-no-files-found: error
