name: Test and build desktop apps

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    name: Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      # pywebview is a hard dependency of the afp package, and on Linux it
      # needs GTK/WebKit system libraries that aren't on the runner image.
      # The tests never open a window, but importing afp.desktop still
      # requires the module to load.
      - name: Install Linux GUI libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-gi gir1.2-webkit2-4.1 libcairo2-dev libgirepository1.0-dev

      - name: Install package
        run: pip install -e ".[dev]"

      - name: Run tests
        run: pytest -q

  build-windows:
    name: Build Windows .exe
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package and PyInstaller
        run: pip install -e ".[build-windows]"

      - name: Build
        run: pyinstaller --noconfirm --clean packaging/afp.spec

      - uses: actions/upload-artifact@v7
        with:
          name: AirportFreqProgrammer-windows
          path: dist/AirportFreqProgrammer.exe
          if-no-files-found: error

  build-macos:
    name: Build macOS .app
    needs: test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package and py2app
        run: pip install -e ".[build-macos]"

      - name: Build
        run: python packaging/py2app_setup.py py2app

      # "It built" and "it runs" are different claims here. Twice now a
      # module resolved by string at runtime (uvicorn's protocols, then
      # anyio's backend) was invisible to the dependency graph, so the
      # bundle built clean and then failed on the first real request.
      # These are exactly the modules nothing statically imports, so
      # nothing but an explicit check will notice they're missing.
      - name: Verify runtime-imported modules were bundled
        run: |
          set -euo pipefail
          APP="$(find dist -maxdepth 1 -name '*.app' -print -quit)"
          LIB="$APP/Contents/Resources/lib/python3.12"
          status=0
          for path in \
            "anyio/_backends/_asyncio.py" \
            "uvicorn/protocols/http/h11_impl.py" \
            "uvicorn/lifespan/on.py" \
            "uvicorn/loops/asyncio.py" \
            "afp/web/static/index.html" \
            "afp/web/static/app.js" \
            "afp/web/static/style.css" \
            "afp/web/static/fonts/chakra-petch-700.woff2" \
            "afp/web/static/fonts/ibm-plex-mono-400.woff2"
          do
            if [ -e "$LIB/$path" ]; then
              echo "ok      $path"
            else
              echo "MISSING $path"; status=1
            fi
          done
          exit $status

      # Zip before uploading: upload-artifact flattens the .app bundle and
      # drops the executable bit, so an uploaded raw .app won't launch.
      # The bundle name is resolved rather than hardcoded -- py2app derives
      # it from the entry script, so it depends on whether the `name=` in
      # py2app_setup.py wins over the launcher.py filename.
      - name: Zip the .app bundle
        run: |
          set -euo pipefail
          APP_PATH="$(find dist -maxdepth 1 -name '*.app' -print -quit)"
          if [ -z "$APP_PATH" ]; then
            echo "No .app bundle produced in dist/"; ls -la dist; exit 1
          fi
          echo "Found bundle: $APP_PATH"
          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" "dist/AirportFreqProgrammer-macos.zip"

      - uses: actions/upload-artifact@v7
        with:
          name: AirportFreqProgrammer-macos
          path: dist/AirportFreqProgrammer-macos.zip
          if-no-files-found: error
