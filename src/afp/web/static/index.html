<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Airport Frequency Programmer</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <header class="topbar">
    <h1>Airport Frequency Programmer</h1>
    <div class="topbar-right">
      <button id="group-setup-link" class="btn btn-small">Group setup instructions</button>
      <div id="cycle-status" class="cycle-status"></div>
    </div>
  </header>

  <main id="app">
    <section id="load-panel" class="load-panel hidden">
      <h2>Load NASR data</h2>
      <p class="muted">Pick a previously downloaded cycle, or fetch the current one from the FAA.</p>
      <div id="cycle-list" class="cycle-list"></div>
      <button id="fetch-btn" class="btn btn-primary">Fetch latest from FAA&hellip;</button>
      <p id="fetch-status" class="muted"></p>
    </section>

    <div id="workspace" class="workspace hidden">
      <aside id="filters" class="filters"></aside>

      <section class="results">
        <div id="counter" class="counter"></div>

        <div id="custom-bar" class="custom-bar"></div>

        <div id="generate-row" class="generate-row">
          <button id="generate-btn" class="btn btn-primary">Generate XML</button>
          <span id="generate-hint" class="muted"></span>
        </div>
        <div id="generate-errors" class="generate-errors hidden"></div>

        <div id="results-note" class="muted"></div>
        <table class="results-table">
          <thead>
            <tr>
              <th>Tag</th>
              <th>Frequency</th>
              <th>Group</th>
              <th>Airport</th>
              <th>City, State</th>
            </tr>
          </thead>
          <tbody id="results-body"></tbody>
        </table>
      </section>
    </div>
  </main>

  <input type="file" id="custom-import-input" accept=".xml" class="hidden">

  <div id="group-setup-modal" class="modal-backdrop hidden">
    <div class="modal-box"></div>
  </div>

  <div id="custom-entries-modal" class="modal-backdrop hidden">
    <div class="modal-box"></div>
  </div>

  <div id="blocked-import-modal" class="modal-backdrop hidden">
    <div class="modal-box"></div>
  </div>

  <script src="/static/app.js"></script>
</body>
</html>
