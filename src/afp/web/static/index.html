<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>FTA-850 Frequency Manager</title>
  <!-- The rounded tile, which is the variant meant to be used as a
       picture rather than masked by an OS. Two sizes so a high-DPI tab
       doesn't upscale the 32. -->
  <link rel="icon" type="image/png" sizes="32x32" href="/static/icon-32.png" />
  <link rel="icon" type="image/png" sizes="256x256" href="/static/icon-256.png" />
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <main id="app">
    <header class="topbar">
      <h1>FTA-850 Frequency Manager</h1>
      <div class="topbar-right">
        <div id="cycle-status" class="cycle-status"></div>
        <button id="group-setup-link" class="btn btn-small">Groups setup help</button>
        <button id="about-link" class="btn btn-small">About</button>
      </div>
    </header>

    <section id="load-panel" class="load-panel hidden">
      <div class="load-panel-box">
        <div class="load-panel-head">
          <h2>Download NASR Frequency Data</h2>
          <p>Pick a previously downloaded cycle, or fetch the current one from the FAA National Airspace System Resource (NASR).</p>
        </div>
        <div class="load-panel-body">
          <div id="cycle-list" class="cycle-list"></div>
          <button id="fetch-btn" class="btn btn-primary">Fetch latest cycle</button>
          <p id="fetch-status"></p>

          <!-- Shown while a fetch or a cached load runs. The label says
               which step; the detail underneath carries the byte count,
               which is the part that visibly moves on a slow line. -->
          <div id="progress" class="progress hidden">
            <div class="progress-bar"><span id="progress-fill"></span></div>
            <div class="progress-text">
              <span id="progress-label"></span>
              <span id="progress-detail" class="progress-detail"></span>
            </div>
            <button id="progress-cancel" class="clear-all">Cancel</button>
          </div>
        </div>
      </div>
    </section>

    <div id="workspace" class="workspace hidden">
      <aside class="filters">
        <div class="filters-head">
          <h2>Filters</h2>
          <button id="clear-filters" class="clear-all">Clear all</button>
        </div>
        <div id="filters-body" class="filters-body"></div>
      </aside>

      <section class="results">
        <div class="results-head">
          <div id="counter" class="counter"></div>
          <div id="breakdown" class="breakdown"></div>
          <div class="generate-row">
            <button id="generate-btn" class="btn btn-primary">Generate FTA-850 XML</button>
            <span id="generate-hint"></span>
          </div>
        </div>

        <div id="custom-bar" class="custom-bar"></div>

        <div id="generate-errors" class="generate-errors hidden"></div>

        <div id="results-note"></div>

        <div class="results-body">
          <table class="results-table">
            <thead>
              <tr>
                <th>Tag</th>
                <th>Frequency</th>
                <th>Group</th>
                <th>Airport</th>
                <th>City, State</th>
              </tr>
            </thead>
            <tbody id="results-body"></tbody>
          </table>
        </div>
      </section>
    </div>
  </main>

  <input type="file" id="custom-import-input" accept=".xml" class="hidden">

  <div id="about-modal" class="modal-backdrop hidden">
    <div class="modal-box"></div>
  </div>

  <div id="group-setup-modal" class="modal-backdrop hidden">
    <div class="modal-box"></div>
  </div>

  <div id="generate-confirm-modal" class="modal-backdrop hidden">
    <div class="modal-box"></div>
  </div>

  <div id="custom-entries-modal" class="modal-backdrop hidden">
    <div class="modal-box wide"></div>
  </div>

  <div id="blocked-import-modal" class="modal-backdrop hidden">
    <div class="modal-box"></div>
  </div>

  <script src="/static/app.js"></script>
</body>
</html>
